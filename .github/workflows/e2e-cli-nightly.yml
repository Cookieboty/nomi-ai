name: E2E CLI nightly

# 真实编程助手 CLI 的一致性测试（e2e-cli/，docs/development/testing.md）：
# 假上游 → 进程内网关 → 从 npm 装的最新版 claude / codex / gemini / grok / dsh。
# 只用本机假上游，不需要任何 secret、不登录任何账号。CLI 发新版后行为变了（新必填字段、
# 新事件），这里第一个发现。
# - 每天定时 + 手动触发；不在 push / PR 上跑（慢，且依赖外部发布的 CLI 版本）。
# - 必填字段探测默认关（每个字段起一次 CLI，很慢）；手动触发时可打开。
#   新版本没有快照时探测跳过比对；打开 update_snapshots 会生成快照并作为 artifact 上传，
#   人工确认后提交到 e2e-cli/snapshots/。
on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      probe:
        description: 'Run the required-field probe (slow)'
        type: boolean
        default: false
      update_snapshots:
        description: 'Write probe snapshots for the installed versions and upload them'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-cli-nightly
  cancel-in-progress: false

env:
  # 与 CI 对齐（Electron 44 内置 Node 24）
  NODE_VERSION: '24'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  e2e-cli:
    name: e2e-cli (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup pnpm (version from package.json#packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 逐个安装：某个 CLI 发布出了问题时只跳过它（e2e-cli 对没装的 CLI 自动跳过），其余照跑
      - name: Install coding-agent CLIs (latest from npm)
        shell: bash
        run: |
          for pkg in @anthropic-ai/claude-code @openai/codex @google/gemini-cli @xai-official/grok @deepseek-ai/dsh; do
            if npm install -g "$pkg@latest"; then
              echo "installed $pkg"
            else
              echo "::warning::failed to install $pkg; its e2e-cli cases will be skipped"
            fi
          done
          for cli in claude codex gemini grok dsh; do
            printf '%s: ' "$cli"
            "$cli" --version 2>/dev/null | head -1 || echo 'not available'
          done

      - name: Build workspaces
        run: pnpm turbo run build

      - name: Run e2e-cli
        env:
          NOMI_E2E_PROBE: ${{ (inputs.probe || inputs.update_snapshots) && '1' || '' }}
          NOMI_E2E_PROBE_UPDATE: ${{ inputs.update_snapshots && '1' || '' }}
        run: pnpm run test:e2e-cli

      - name: Upload probe snapshots
        if: ${{ always() && inputs.update_snapshots }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-cli-snapshots-${{ github.run_id }}
          path: e2e-cli/snapshots/
          if-no-files-found: ignore
          retention-days: 14
