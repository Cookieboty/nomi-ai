# Go + Wails v3 桌面版：三平台 go vet / go test、构建、体积与内存实测。
# 安装包与 Release 见 desktop-go-package.yml（tag 发版时不重跑本 workflow：打 tag 前 main 上已全绿）。
name: desktop-go
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop-go/**'
      # 视图（packages/renderer、ai-chat）与契约内嵌进 Go 程序
      - 'packages/**'
      - 'scripts/go-contract/**'
      # Go 测试用的假 CLI；build 任务构建的视图里打包了角色包
      - 'scripts/mock-cli/**'
      - 'characters/**'
      - '.github/workflows/desktop-go.yml'
permissions:
  contents: read
# 按分支分组：push main 不取消，一个在跑 + 只保留最新一个排队；
# PR 上新提交取消旧 run（旧提交的结果没人看，还占着三平台 runner、让新 run 排队）。
concurrency:
  group: desktop-go-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  WAIT: '45' # runner 上冷启动后等待秒数（Linux 本机实测用 120s）
jobs:
  # 测试与构建 / 实测分成两个并行 job：任一边失败只重跑那一边（以前一个 job 里全做，实测步骤挂了也要整个重跑 go test）
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.22.0, cache: pnpm }
      - uses: actions/setup-go@v5
        with:
          { go-version-file: apps/desktop-go/go.mod, cache-dependency-path: apps/desktop-go/go.sum }
      - name: linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: contract → go (drift check)
        if: runner.os == 'Linux'
        run: |
          pnpm --filter @nomi-ai/contract build
          node scripts/go-contract/gen.mjs --check
      - name: go vet + go test (failed packages retried once)
        working-directory: apps/desktop-go
        run: |
          mkdir -p frontend/dist && touch frontend/dist/.keep
          TAGS=(); [ "$RUNNER_OS" = Linux ] && TAGS=(-tags gtk3); [ "$RUNNER_OS" = macOS ] && TAGS=(-tags private_mac_apis)
          ci/go-test.sh "${TAGS[@]}"

  # 构建 + 体积 + macOS 透明窗口验证 + 内存实测（与 test 并行）。未签名的 CI 构建，不是安装包；内存实测只报告，不让 CI 变红
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.22.0, cache: pnpm }
      - uses: actions/setup-go@v5
        with:
          { go-version-file: apps/desktop-go/go.mod, cache-dependency-path: apps/desktop-go/go.sum }
      - name: linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: frontend
        run: node apps/desktop-go/frontend/build.mjs
      - name: go build + package
        working-directory: apps/desktop-go
        run: |
          mkdir -p dist-ci
          case "$RUNNER_OS" in
            Windows)
              go build -trimpath -ldflags "-s -w -H windowsgui" -o build/bin/nomi-ci.exe .
              cp build/bin/nomi-ci.exe dist-ci/
              (cd build/bin && 7z a -tzip ../../dist-ci/nomi-ci-windows-amd64.zip nomi-ci.exe >/dev/null) ;;
            macOS)
              go build -tags private_mac_apis -trimpath -ldflags "-s -w" -o build/bin/nomi-ci .
              APP="build/Nomi CI.app"; mkdir -p "$APP/Contents/MacOS"
              cp build/bin/nomi-ci "$APP/Contents/MacOS/nomi-ci"
              cat > "$APP/Contents/Info.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>nomi-ci</string>
          <key>CFBundleIdentifier</key><string>com.cookieboty.nomi.ci</string>
          <key>CFBundleName</key><string>Nomi CI</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>LSUIElement</key><true/>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PL
              codesign --force --deep -s - "$APP" || true
              (cd build && ditto -c -k --keepParent "Nomi CI.app" ../dist-ci/nomi-ci-macos-arm64.zip) ;;
            Linux)
              go build -tags gtk3 -trimpath -ldflags "-s -w" -o build/bin/nomi-ci .
              tar czf dist-ci/nomi-ci-linux-amd64.tar.gz -C build/bin nomi-ci ;;
          esac
          {
            echo "### ${{ matrix.os }} 体积（字节）"
            echo '```'
            ls -l build/bin dist-ci
            [ -d "build/Nomi CI.app" ] && du -sk "build/Nomi CI.app" | awk '{print ".app du -sk(KiB): "$1}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nomi-ci-${{ matrix.os }}
          path: apps/desktop-go/dist-ci/

      - name: mac transparency proof
        if: runner.os == 'macOS'
        working-directory: apps/desktop-go
        run: ci/mac-transparency.sh "$PWD/build/Nomi CI.app/Contents/MacOS/nomi-ci" "$PWD/shots"
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: mac-transparency
          path: apps/desktop-go/shots/

      # ---------- 内存实测 ----------
      - name: measure (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop-go
        run: ci/measure-mac.sh "$PWD/build/Nomi CI.app/Contents/MacOS/nomi-ci" "$PWD/mem" || true
      - name: measure (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true # 实测数据只报告，不让 CI 变红
        working-directory: apps/desktop-go
        shell: pwsh
        run: ./ci/measure-win.ps1 -Bin "$PWD\build\bin\nomi-ci.exe" -Out "$PWD\mem"

      - name: summarize
        if: runner.os != 'Linux'
        continue-on-error: true
        working-directory: apps/desktop-go
        run: |
          { echo "### ${{ matrix.os }} 内存（三次中位数，MiB）"; echo '| 场景 | 进程数 | 合计 | 中位那次各进程 |'; echo '|---|---|---|---|'
            python3 ci/summarize.py mem || python ci/summarize.py mem
            # 各启动阶段耗时（[startup] main-enter / window-create / first-paint …）；没有日志时不算失败（bash -eo pipefail）
            echo; echo '```'; grep -h "\[startup\]" mem/*app*.log 2>/dev/null || true; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && runner.os != 'Linux'
        with:
          name: mem-${{ matrix.os }}
          path: apps/desktop-go/mem/
