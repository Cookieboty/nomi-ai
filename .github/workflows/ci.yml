name: CI

# 视图与脚本的检查（Go 内核与安装包见 desktop-go.yml / desktop-go-package.yml；详见 docs/development/ci.md）：
# - push main：三平台 quality
# - push feat/**：不触发（改由 PR 触发）
# - PR → main / feat/**：只跑快速检查（quality Linux + changeset status）；
#   带 `ci:full` 标签时三平台 quality
# - merge_group（若启用合并队列）/ workflow_dispatch：完整 CI
# - PR 只改文档 / changeset（docs/**、*.md、.changeset/**）时整个 workflow 不跑；
#   main 目前没有分支保护 / 必需检查，所以 paths-ignore 不会卡住合并。若以后加必需检查，
#   要改成 paths-filter job（跳过的 workflow 会让必需检查一直 pending）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/**']
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.changeset/**'
  merge_group:
  workflow_dispatch:

# 最小权限：所有 job 只读仓库内容；需要更多权限的 job 单独声明。
permissions:
  contents: read

# PR：同一 PR 的新提交 / 加 ci:full 会取消旧的 run。main / 合并队列 / 手动触发不取消。
# 加其它标签触发的 run 什么都不跑：给它一个独立的 group（带 run_id），免得把正在跑的 PR run 取消掉。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'ci:full') && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # 快速检查：所有事件都跑；普通 PR 只在 Linux 上跑，ci:full / push / 手动触发时三平台
  quality:
    if: ${{ !(github.event.action == 'labeled' && github.event.label.name != 'ci:full') }}
    name: quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup pnpm (version from package.json#packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Licence check (deps allow-list + asset manifest)
        run: pnpm check:licenses

      - name: i18n check (every user-facing string has an English translation)
        run: pnpm check:i18n

      - name: Character name leak check (official character only in characters/nomi and brand)
        run: pnpm check:character-leak

      - name: Character pack contract (official characters/nomi)
        run: pnpm character:check

      - name: Character pack contract (test-dummy and static demo packs)
        run: |
          node scripts/character/check.mjs characters/test-dummy
          node scripts/character/check.mjs examples/static-demo.pack

      - name: Frontend architecture check (file budgets and registered exceptions)
        run: pnpm check:frontend

      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Typecheck / Lint / Test / Build
        # macOS runner 只有 3 核：turbo 默认并发 10，tsc / eslint / vite build 与 jsdom 测试抢 CPU，
        # 单个本地 <1s 的用例会拖到 15s 超时（scaleInput、modelsPage 轮流挂）。macOS 上限 2 个任务并行。
        # --continue=dependencies-successful：一个包失败不停掉其它包，一轮报出全部失败
        # （以前第一个失败就停，后面被挡住的测试要推好几轮才一个个暴露）；只取消依赖失败任务的下游
        run: pnpm turbo run typecheck lint test build --cache-dir=.turbo/cache --continue=dependencies-successful --concurrency=${{ runner.os == 'macOS' && '2' || '10' }}

      - name: Root script tests
        if: ${{ !cancelled() }} # 上一步失败也跑，同样不让失败互相遮挡
        run: pnpm run test:root

      # 首屏体积预算：只报告（::warning 注解 + job summary），不让 CI 变红；要强制失败加 --strict
      - name: Bundle size budget (informational)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: node scripts/check-bundle-budget.mjs

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}
          path: packages/**/coverage/**
          if-no-files-found: ignore
          retention-days: 7

  changeset:
    name: changeset status
    if: ${{ github.event_name == 'pull_request' && !(github.event.action == 'labeled' && github.event.label.name != 'ci:full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0 # changeset status 需要与 origin/main 比较

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify changeset status against baseBranch
        run: pnpm run changeset:status

      - name: Root CHANGELOG matches changesets
        run: pnpm run changelog:check
