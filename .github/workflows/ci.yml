name: CI

on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_only:
        description: 'Skip quality/e2e/dev-smoke; only build-electron (应急打正式安装包)'
        type: boolean
        default: false
      platforms:
        description: 'Comma list: linux,mac,win (empty = all)'
        type: string
        default: ''

# 最小权限：所有 job 只读仓库内容；需要更多权限的 job 单独声明。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # tag 构建（发布产物）不允许被后续 push 取消
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Electron 44 内置 Node 24，CI 对齐到 24。
  NODE_VERSION: '24'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.package_only) }}
    name: quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm (version from package.json#packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Licence check (deps allow-list + asset manifest)
        run: pnpm check:licenses

      - name: i18n check (every user-facing string has an English translation)
        run: pnpm check:i18n

      - name: Frontend architecture check (file budgets and registered exceptions)
        run: pnpm check:frontend

      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Typecheck / Lint / Test / Build
        run: pnpm turbo run typecheck lint test build --cache-dir=.turbo/cache

      - name: Root script tests
        run: pnpm run test:root

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}
          path: |
            packages/**/coverage/**
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------
  # E2E · headless（vitest，e2e/tests）
  # ---------------------------------------------------------------
  e2e-headless:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.package_only) }}
    name: e2e-headless (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspaces (required for test:e2e imports)
        run: pnpm turbo run build

      - name: Run headless E2E (E1..E5)
        run: pnpm run test:e2e

  # ---------------------------------------------------------------
  # E2E · headed（Playwright + 真实 Electron，xvfb 虚拟显示）
  # ---------------------------------------------------------------
  # Linux 用 xvfb 虚拟显示；Windows runner 自带交互桌面，可直接跑 headed Electron。
  e2e-headed:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.package_only) }}
    name: e2e-headed (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron >= 44 不再在 postinstall 下载二进制，需显式安装
      - name: Download Electron binary
        run: pnpm --filter @nomi-ai/electron exec install-electron

      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xdotool

      # Ubuntu 24.04 默认禁止非特权 user namespace，Chromium 沙箱会启动失败
      - name: Allow Chromium sandbox (unprivileged userns)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # e2e 3D 测试模型（CC0，~17MB）不入库：globalSetup 下载并校验 sha256，这里缓存
      - name: Cache e2e test avatar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: e2e-headed/.cache
          key: e2e-avatar-9adf1b44e959d2688d62c2dd558e74315d6aa40e3bf8d281390b7a85dc0df9b7

      - name: Build workspaces + copy renderer bundles
        run: |
          pnpm turbo run build
          pnpm --filter @nomi-ai/electron run copy-renderer

      - name: Run headed E2E (Linux / xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:e2e:headed

      - name: Run headed E2E (Windows)
        if: runner.os == 'Windows'
        run: pnpm run test:e2e:headed

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------
  # Changesets 校验（仅 PR）——涉及 fixed-group 三包必须附 changeset
  # ---------------------------------------------------------------
  # 开发模式冒烟：全新 install 后跑 `pnpm dev`，等看板娘窗口 + VRM 模型 + 对话窗口 dev server 就绪后退出，
  # 防止开发启动链路（预构建、端口等待、preload 打包、Electron 二进制下载）再次悄悄坏掉。
  dev-smoke:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.package_only) }}
    name: dev-smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Clean install (no turbo cache, no prebuilt dist)
        run: pnpm install --frozen-lockfile

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Allow Chromium sandbox (unprivileged userns)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: pnpm dev → wait for mascot + chat window → stop
        run: xvfb-run -a node scripts/dev-smoke.mjs 600

  changeset:
    name: changeset status
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changeset status 需要与 origin/main 比较

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify changeset status against baseBranch
        run: pnpm run changeset:status

      - name: Root CHANGELOG matches changesets
        run: pnpm run changelog:check

  # ---------------------------------------------------------------
  # Electron 打包：三平台 runner 各打原生包（AppImage / DMG / NSIS）。
  # 正式安装包以本 job 的 artifact / tag 时的 GitHub Release 为准；
  # 不要在 Linux box 上用 wine 交叉打 Win/Mac 当正式产物（离线 TTS sherpa 原生库会对不上）。
  # 签名/公证：仅 tag 构建经 scripts/release/signing-env.mjs 门控注入 secret；其它事件不签名。
  # ---------------------------------------------------------------
  build-electron:
    name: build-electron (${{ matrix.os }})
    needs: [quality]
    # package_only：quality 被 skip 时仍继续；quality 失败则拦住（非 package_only）
    if: ${{ always() && (needs.quality.result == 'success' || needs.quality.result == 'skipped') }}
    # Tag builds publish installers to the GitHub Release (electron-updater feed).
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, script: 'package:prod:linux', artifact: linux }
          - { os: macos-latest, script: 'package:prod:mac', artifact: mac }
          - { os: windows-latest, script: 'package:prod:win', artifact: win }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Optionally filter platforms (workflow_dispatch)
        id: plat
        shell: bash
        run: |
          want='${{ github.event.inputs.platforms }}'
          art='${{ matrix.artifact }}'
          if [ -z "$want" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          want_norm=$(echo "$want" | tr '[:upper:]' '[:lower:]' | tr -d ' ')
          if echo ",${want_norm}," | grep -q ",${art},"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${art} (platforms filter: ${want})"
          fi

      - name: Checkout
        if: steps.plat.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        if: steps.plat.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        if: steps.plat.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: steps.plat.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # pnpm only installs optional sherpa natives for *this* OS/CPU.
      # Mac DMG is dual-arch → also fetch the other darwin arch; never cross-OS.
      - name: Ensure sherpa-onnx natives for target
        if: steps.plat.outputs.run == 'true'
        shell: bash
        run: node scripts/release/ensure-sherpa-platform.mjs ${{ matrix.artifact }}

      - name: Verify sherpa natives (fail if still missing)
        if: steps.plat.outputs.run == 'true'
        shell: bash
        run: node scripts/release/ensure-sherpa-platform.mjs ${{ matrix.artifact }} --check

      # quality 作业已用相同 key 保存 turbo 缓存（needs: quality），这里直接命中，跳过重复构建
      - name: Turbo cache
        if: steps.plat.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: electron / electron-builder download cache
        if: steps.plat.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-dl-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-dl-${{ runner.os }}-

      # Offline TTS weights (~133MB) staged by prepackage → sync-tts-model.mjs
      - name: Cache sherpa TTS model
        if: steps.plat.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/electron/resources/tts-models
          key: tts-model-vits-zh-hf-theresa-f337638c49689e1d
          restore-keys: |
            tts-model-vits-zh-hf-theresa-

      - name: Build workspaces
        if: steps.plat.outputs.run == 'true'
        run: pnpm turbo run build --cache-dir=.turbo/cache

      - name: electron-builder package (PR / push / dispatch · no publish, unsigned)
        if: ${{ steps.plat.outputs.run == 'true' && !startsWith(github.ref, 'refs/tags/v') }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm run ${{ matrix.script }}

      # 签名 / 公证门控：只有整组 secret 齐全才导出给 electron-builder（见 docs/RELEASE.md）。
      # 缺失或不完整 → 降级为未签名 / 不公证并给出 ::notice::，不会让发布失败。
      - name: Resolve signing / notarization env (tag)
        if: ${{ steps.plat.outputs.run == 'true' && startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: node scripts/release/signing-env.mjs ${{ matrix.artifact }}

      - name: electron-builder package + publish to GitHub Release (tag)
        if: ${{ steps.plat.outputs.run == 'true' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          # Default GITHUB_TOKEN works with contents:write on this repo.
          # Set repository secret GH_TOKEN (PAT, repo scope) only if the default token cannot create Releases.
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # matrix.artifact is linux | mac | win → package:publish:{linux,mac,win}
        run: pnpm --filter @nomi-ai/electron run package:publish:${{ matrix.artifact }}

      # PR / push 也跑一遍门控脚本（无 secret → 预期 unsigned），保证脚本在三平台都能执行
      - name: Signing gate dry-run
        if: ${{ steps.plat.outputs.run == 'true' && !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: node scripts/release/signing-env.mjs ${{ matrix.artifact }}

      - name: Upload installer artifact
        if: steps.plat.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.zip
            dist/*.blockmap
            dist/*.nsis.7z
            dist/*nsis*
            dist/latest*.yml
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 14 || 3 }}
