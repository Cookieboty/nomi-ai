<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>e2e-headed harness</title>
    <style>
      body {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        background: #0b1020;
        color: #dbe4ff;
        padding: 16px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      pre {
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>Nomi · P9-11 headed harness</h1>
    <p id="status">initializing…</p>
    <pre id="log"></pre>
    <script>
      (function () {
        const status = document.getElementById('status');
        const log = document.getElementById('log');
        const write = (msg) => {
          log.textContent += msg + '\n';
        };
        if (!window.nomiTransport || !window.nomiHost) {
          status.textContent = 'nomiTransport / nomiHost missing (preload failed)';
          write('[fatal] window.nomiTransport / window.nomiHost missing');
          return;
        }
        status.textContent = 'nomiTransport ready';
        write('[boot] preload done');
      })();
    </script>
  </body>
</html>
