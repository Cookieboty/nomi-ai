<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Nomi mascot (POC)</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      #app { position: absolute; inset: 0; }
      #st { position: absolute; top: 4px; left: 4px; font: 11px system-ui; color: #a33; }
    </style>
  </head>
  <body>
    <div id="st"></div>
    <div id="app"></div>
    <script>
      // 首帧即通知宿主显示窗口（= Electron ready-to-show）；不依赖 Wails runtime（它要到 load 后才注入）
      requestAnimationFrame(() => requestAnimationFrame(() => {
        try { (window.webkit && webkit.messageHandlers.external || window.chrome && chrome.webview).postMessage('nomi:first-paint'); } catch (e) {}
      }));
    </script>
    <script type="module" src="./src/mascot.ts"></script>
  </body>
</html>
