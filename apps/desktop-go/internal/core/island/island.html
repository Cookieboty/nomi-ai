<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <!--
  灵动岛页面（geometry.go 的 IslandHTML 替换 ⟦…⟧ 几何数值）。
  两种内容叠在一起显示：
  - 通知（show）：一条，几秒后自动收起，可以手动关掉；
  - 等你处理的事（setPending，HITL）：一直显示到处理完；每条带操作按钮（允许 / 拒绝 / 验收…），点了发给内核。
  只有一条时是一个大胶囊；多条时上面一行「N 项等你处理」，下面逐条列出（超出可滚动）。
  与内核的信号（postMessage）：nomi:island:size:<高度> 改窗口高度、nomi:island:act:<json> 操作、
  nomi:island:open 点岛打开对话、nomi:island:open:<json id> 点某一条（跳到它）、nomi:island:hidden 收起完成、
  nomi:island:dismiss 用户关掉（Esc / 关闭按钮：等你处理的事先不显示，来了新的再一起显示）。
-->
    <style>
      :root {
        color-scheme: dark;
        --w: ⟦width⟧px;
        --cw: ⟦cw⟧px;
        --ch: ⟦ch⟧px;
        --h: ⟦ch⟧px;
        --inset: ⟦inset⟧px;
        --padT: ⟦padT⟧px;
        --padB: ⟦padB⟧px;
        --mx: ⟦mx⟧px;
        --accent: #f08a5d;
        --accent-2: #fb9466;
        --ok: #4cc38a;
        --warn: #f5a742;
        --bad: #f26b5b;
        --bg: rgba(24, 19, 16, 0.94);
        --fg: #f7f1ec;
        --fg2: rgba(247, 241, 236, 0.62);
        --line: rgba(255, 196, 160, 0.14);
        --btn: rgba(255, 255, 255, 0.09);
        --btn-h: rgba(255, 255, 255, 0.15);
        --shadow: 0 10px 28px rgba(0, 0, 0, 0.38), 0 2px 6px rgba(0, 0, 0, 0.28);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font:
          500 13px/1.35 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI Variable Text',
          'Segoe UI',
          'PingFang SC',
          'Microsoft YaHei UI',
          system-ui,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      /* 岛贴窗口顶部；窗口高度 = 岛高度（+ 胶囊投影留白），随内容由内核调整 */
      #island {
        position: absolute;
        top: 0;
        left: var(--mx);
        width: var(--cw);
        height: var(--ch);
        margin-left: calc((var(--w) - var(--cw)) / 2);
        color: var(--fg);
        overflow: hidden;
        cursor: pointer;
        background:
          radial-gradient(120% 140% at 0% 0%, rgba(240, 138, 93, 0.16), transparent 55%), var(--bg);
        border-radius: calc(var(--ch) / 2);
        box-shadow:
          var(--shadow),
          0 0 0 1px var(--line) inset;
        -webkit-backdrop-filter: blur(24px) saturate(1.3);
        backdrop-filter: blur(24px) saturate(1.3);
        transition:
          width 0.36s cubic-bezier(0.22, 0.9, 0.3, 1),
          height 0.36s cubic-bezier(0.22, 0.9, 0.3, 1),
          margin-left 0.36s cubic-bezier(0.22, 0.9, 0.3, 1),
          border-radius 0.36s ease,
          opacity 0.2s ease;
        opacity: 0;
      }
      #island.on {
        opacity: 1;
      }
      #island.open {
        width: var(--w);
        height: var(--h);
        margin-left: 0;
        border-radius: 30px;
      }
      #island.open.list {
        border-radius: 26px;
      }
      /* 刘海屏：从刘海里长出来，上沿贴屏幕顶、只圆下角 */
      #island.notch {
        border-radius: 0 0 14px 14px;
        background: #000;
        box-shadow: none;
      }
      #island.notch.open {
        border-radius: 0 0 26px 26px;
      }
      #content {
        position: absolute;
        top: 0;
        left: 50%;
        width: var(--w);
        margin-left: calc(var(--w) / -2);
        box-sizing: border-box;
        padding: calc(var(--inset) + var(--padT)) 14px var(--padB);
        opacity: 0;
        transform: translateY(-4px);
        transition:
          opacity 0.2s ease 0.08s,
          transform 0.28s ease 0.06s;
      }
      #island.open #content {
        opacity: 1;
        transform: none;
      }
      #island.list #content {
        padding: calc(var(--inset) + var(--padT) + 6px) 12px calc(var(--padB) + 6px);
      }

      /* 列表头：多条时才有 */
      #head {
        display: none;
        align-items: center;
        gap: 8px;
        padding: 2px 4px 8px;
        color: var(--fg2);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #island.list #head {
        display: flex;
      }
      #head .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 3px rgba(240, 138, 93, 0.2);
      }
      #rows {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: ⟦listMax⟧px;
        overflow-y: auto;
        scrollbar-width: none;
      }
      #rows::-webkit-scrollbar {
        display: none;
      }

      /* 上下各留 5px：图标右下角的角标伸出图标块，不被列表的滚动区裁掉 */
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 44px;
        padding: 5px 0;
        border-radius: 18px;
      }
      #island.list .row {
        padding: 6px 8px;
        background: rgba(255, 255, 255, 0.045);
        min-height: 40px;
      }
      #island.list .row:hover {
        background: rgba(255, 255, 255, 0.075);
      }
      .row.flash {
        animation: flash 1.2s ease;
      }
      @keyframes flash {
        30% {
          background: rgba(240, 138, 93, 0.16);
        }
      }

      /* 左侧：Nomi 图标块 + 状态角标 */
      .av {
        position: relative;
        flex: 0 0 44px;
        width: 44px;
        height: 44px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: #fcefe1;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.12) inset,
          0 4px 12px rgba(240, 138, 93, 0.22);
      }
      #island.list .av {
        flex-basis: 34px;
        width: 34px;
        height: 34px;
        border-radius: 11px;
      }
      .av > svg.nomi {
        width: 30px;
        height: 30px;
        display: block;
      }
      #island.list .av > svg.nomi {
        width: 23px;
        height: 23px;
      }
      .av > svg.ep {
        width: 100%;
        height: 100%;
        border-radius: inherit;
        display: block;
      }
      .badge {
        position: absolute;
        right: -5px;
        bottom: -5px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #fff;
        background: var(--accent);
        box-shadow: 0 0 0 2px #1a1411;
      }
      #island.list .badge {
        width: 15px;
        height: 15px;
        right: -4px;
        bottom: -4px;
      }
      .badge svg {
        width: 11px;
        height: 11px;
        display: block;
      }
      #island.list .badge svg {
        width: 9px;
        height: 9px;
      }
      .badge[data-tone='done'] {
        background: var(--ok);
      }
      .badge[data-tone='failed'] {
        background: var(--bad);
      }
      .badge[data-tone='attention'] {
        background: var(--warn);
      }
      .badge[data-tone='running'] {
        background: #1a1411;
        color: var(--accent);
      }
      .badge[data-tone='running'] svg {
        animation: spin 1s linear infinite;
        width: 13px;
        height: 13px;
      }
      .badge[data-tone='message'] {
        background: #f2657a;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .text {
        min-width: 0;
        flex: 1;
      }
      .title {
        font-weight: 650;
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #island.list .title {
        font-size: 13px;
      }
      .body {
        color: var(--fg2);
        font-weight: 450;
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
      }
      .body:empty {
        display: none;
      }

      /* 右侧：操作按钮 / 关闭 / 进行中的脉冲点 */
      .acts {
        flex: none;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .btn {
        height: 30px;
        padding: 0 14px;
        border: 0;
        border-radius: 15px;
        font: inherit;
        font-size: 12.5px;
        font-weight: 650;
        color: var(--fg);
        background: var(--btn);
        cursor: pointer;
        white-space: nowrap;
        transition:
          background 0.15s ease,
          transform 0.1s ease;
      }
      #island.list .btn {
        height: 26px;
        padding: 0 11px;
        border-radius: 13px;
        font-size: 12px;
      }
      .btn:hover {
        background: var(--btn-h);
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn.primary {
        color: #2a160c;
        background: linear-gradient(180deg, var(--accent-2), var(--accent));
      }
      .btn.primary:hover {
        filter: brightness(1.06);
      }
      .btn.danger {
        color: #ffd9d3;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .btn:focus-visible,
      .x:focus-visible {
        outline: 2px solid var(--accent-2);
        outline-offset: 2px;
      }
      .x {
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--fg2);
        background: transparent;
        cursor: pointer;
      }
      .x:hover {
        color: var(--fg);
        background: var(--btn);
      }
      .x svg {
        width: 15px;
        height: 15px;
        display: block;
      }
      #head .x {
        width: 22px;
        height: 22px;
        margin: -4px 0 -4px auto;
      }
      #head .x svg {
        width: 13px;
        height: 13px;
      }
      .pulse {
        width: 10px;
        height: 10px;
        margin: 0 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 0 rgba(240, 138, 93, 0.5);
        animation: pulse 1.6s ease-out infinite;
      }
      @keyframes pulse {
        70% {
          box-shadow: 0 0 0 8px rgba(240, 138, 93, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(240, 138, 93, 0);
        }
      }
      #more {
        display: none;
        padding: 6px 4px 0;
        color: var(--fg2);
        font-size: 11.5px;
        text-align: center;
      }
      #more.on {
        display: block;
      }
      @media (prefers-reduced-motion: reduce) {
        #island,
        #content {
          transition: none;
        }
        .pulse,
        .badge svg,
        .row.flash {
          animation: none !important;
        }
      }
    </style>
  </head>

        const t = EP[ep];
        const s = svgEl('svg', { class: 'ep', viewBox: '0 0 16 16', 'aria-hidden': 'true' });
        s.append(svgEl('rect', t.stroke ? { x: .3, y: .3, width: 15.4, height: 15.4, rx: 4, fill: t.fill, stroke: t.stroke, 'stroke-width': .6 }
          : { width: 16, height: 16, rx: 4, fill: t.fill }));
        for (const g of t.g) {
          const a = { d: g.d, fill: g.fill || 'none' };
          if (g.stroke) Object.assign(a, { stroke: g.stroke, 'stroke-width': g.sw, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
          if (g.tf) a.transform = g.tf;
          s.append(svgEl('path', a));
        }
        return s;
      }
      // 角标：等你处理的 → approval；其余按状态 / 类型
      function badgeOf(it) {
        if (it.actions && it.actions.length) return 'approval';
        if (it.status) return it.status;
        if (it.kind === 'message') return 'message';
        if (it.kind === 'reminder') return 'reminder';
        return '';
      }
      const TONE = { approval: 'attention', running: 'running', done: 'done', failed: 'failed', attention: 'attention', message: 'message', reminder: 'attention' };

      let labels = { count: '{0}', more: '+{0}', close: 'Close' };
      let pending = [];   // 等你处理的事（内核推来，处理完之前一直在）
      let notice = null;  // 当前通知（几秒后收起）
      let timer = 0, hovered = false, shownH = 0, busy = new Set();
      const fmt = (s, n) => String(s).replace('{0}', n);

      // 关闭按钮：默认关掉整个岛（通知 + 等你处理的事，同 Esc）
      function closeBtn(fn) {
        const x = h('button', 'x');
        x.type = 'button';
        x.setAttribute('aria-label', labels.close);
        x.title = labels.close;
        x.append(icon('close', 2));
        x.addEventListener('click', (e) => { e.stopPropagation(); (fn || closeAll)(); });
        return x;
      }

      // 关掉整个岛（Esc / 关闭按钮）：通知收起；等你处理的事告诉内核先不显示（没有处理，对话里照样能处理）
      function closeAll() {
        clearTimeout(timer);
        notice = null;
        if (pending.length) {
          pending = [];
          busy.clear();
          post('nomi:island:dismiss');
        }
        collapse();
      }

      let single = false;
      function rowOf(it, isNotice) {
        const r = h('div', 'row');
        r.dataset.id = it.id || '';
        const av = h('div', 'av');
        av.append(it.endpoint && EP[it.endpoint] ? epTile(it.endpoint) : nomiGlyph());
        const b = badgeOf(it);
        if (b) {
          const badge = h('span', 'badge');
          badge.dataset.tone = TONE[b] || '';
          badge.append(icon(b, b === 'running' ? 2.6 : 3));
          av.append(badge);
        }
        const text = h('div', 'text');
        text.append(h('div', 'title', String(it.title || '')), h('div', 'body', String(it.body || '')));
        r.append(av, text);
        // 等你处理的一条：点这一行（按钮以外）= 打开对话窗口并跳到它
        if (!isNotice && it.id) {
          r.addEventListener('click', (e) => {
            e.stopPropagation();
            post('nomi:island:open:' + JSON.stringify(it.id));
          });
        }
        const acts = h('div', 'acts');
        if (it.actions && it.actions.length) {
          for (const a of it.actions) {
            const btn = h('button', 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : ''), String(a.label));
            btn.type = 'button';
            btn.disabled = busy.has(it.id);
            btn.setAttribute('aria-label', a.label + ' · ' + (it.title || ''));
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              busy.add(it.id);
              for (const x of acts.querySelectorAll('button')) x.disabled = true;
              post('nomi:island:act:' + JSON.stringify({ id: it.id, action: a.id }));
              // 内核一直没回（列表没变、也没报失败）：按钮恢复可点，不会一直灰着
              setTimeout(() => { if (busy.delete(it.id)) render(); }, 8000);
            });
            acts.append(btn);
          }
          // 只有这一条时没有列表头：关闭按钮放在这一行
          if (!isNotice && single) acts.append(closeBtn());
        } else if (it.status === 'running' && !isNotice) {
          acts.append(h('span', 'pulse'));
        } else {
          acts.append(closeBtn(dismissNotice));
        }
        r.append(acts);
        return r;
      }

      const measure = () => Math.ceil($('content').getBoundingClientRect().height);

      function render() {
        const items = notice ? [Object.assign({ id: '__notice' }, notice)].concat(pending) : pending.slice();
        if (!items.length) return collapse();
        const list = items.length > 1;
        single = !list;
        el.classList.toggle('list', list);
        $('headText').textContent = pending.length ? fmt(labels.count, pending.length) : '';
        const rows = $('rows');
        rows.replaceChildren(...items.map((it) => rowOf(it, it.id === '__notice')));
        if (notice && list) rows.firstChild.classList.add('flash');
        const hidden = Math.max(0, items.length - ⟦listRows⟧);
        $('more').textContent = hidden ? fmt(labels.more, hidden) : '';
        $('more').classList.toggle('on', hidden > 0);
        const target = Math.max(⟦ch⟧, measure());
        setHeight(target);
        open();
      }

      // 窗口高度：长高时先改窗口再展开；变矮时等收缩动画做完再改窗口（不裁掉动画）
      function setHeight(target) {
        document.documentElement.style.setProperty('--h', target + 'px');
        if (target > shownH) { shownH = target; post('nomi:island:size:' + target); }
        else if (target < shownH) {
          const t = target;
          setTimeout(() => { if (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--h')) === t) { shownH = t; post('nomi:island:size:' + t); } }, 400);
        }
      }

      function open() {
        el.classList.add('on');
        requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('open')));
      }

      function collapse() {
        clearTimeout(timer);
        el.classList.remove('open');
        setTimeout(() => {
          if (notice || pending.length) return;
          el.classList.remove('on', 'list');
          $('rows').replaceChildren();
          post('nomi:island:hidden');
        }, 400);
      }

      function armTimer() {
        clearTimeout(timer);
        if (!notice || hovered) return;
        timer = setTimeout(dismissNotice, Math.max(1500, notice.durationMs || 4500));
      }

      function dismissNotice() {
        clearTimeout(timer);
        if (!notice) return;
        notice = null;
        if (pending.length) { render(); post('nomi:island:hidden'); } else collapse();
      }

      window.__island = {
        /** 一条通知：显示几秒后收起（有等你处理的事时，叠在列表最上面） */
        show(n) { notice = n || null; render(); armTimer(); return shownH; },
        /** 等你处理的事（整份替换）；labels：列表头、更多、关闭的文案 */
        setPending(list, l) {
          if (l) labels = Object.assign(labels, l);
          hc.setAttribute('aria-label', labels.close);
          hc.title = labels.close;
          pending = Array.isArray(list) ? list : [];
          const live = new Set(pending.map((x) => x.id));
          for (const id of [...busy]) if (!live.has(id)) busy.delete(id);
          if (pending.length || notice) render(); else collapse();
        },
        /** 操作被内核拒绝（已经处理过、过期）：恢复按钮 */
        actFailed(id) { busy.delete(id); render(); },
        hide() { notice = null; pending = []; collapse(); },
      };
      const hc = $('headClose');
      hc.append(icon('close', 2));
      hc.addEventListener('click', (e) => { e.stopPropagation(); closeAll(); });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { e.preventDefault(); closeAll(); }
      });
      el.addEventListener('click', () => { post('nomi:island:open'); if (!pending.length) dismissNotice(); });
      el.addEventListener('mouseenter', () => { hovered = true; clearTimeout(timer); });
      el.addEventListener('mouseleave', () => { hovered = false; if (notice) timer = setTimeout(dismissNotice, 1500); });
    </script>
  </body>
</html>
