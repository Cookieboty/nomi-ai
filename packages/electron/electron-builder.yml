# electron-builder 配置 · P9-9 Polish B
#
# 本文件由 [packages/electron/package.json](package.json)
# 的 `package:*` 脚本消费。相较此前内嵌在 package.json 的 `build` 字段，独立成
# YAML 后：
# - 便于按 target/env 变量差分（AppImage / DMG / NSIS / notarize / sign）；
# - 便于 CI 三平台 build（.github/workflows/ci.yml）在 workflow 里显式覆盖；
# - Notarize / Windows Sign 通过环境变量启用（默认关闭以便本地开发 & PR CI 免凭证）。
#
# v26 note: pnpm "node module collector" OOMs on this monorepo (~4GB default heap).
# electron-builder then falls back to manual node_modules traversal and packaging
# still succeeds — do NOT raise NODE_OPTIONS to force the collector (it can hang for
# tens of minutes on CI). pnpm deploy staging is only needed if traversal also fails.

appId: com.cookieboty.nomi
productName: Nomi

# 只保留 Chromium 自带界面字符串（右键菜单、原生对话框等）的英文与简体中文语言包，其余 locales/*.pak
# （mac 为 *.lproj）在打包时删除。"en" 同时匹配 en-US / en-GB。应用自身的语言检测在主进程用
# app.getPreferredSystemLanguages()（读系统设置，不受影响），渲染进程启动后经 ai:locale:get 跟随主进程，
# 所以繁中等系统仍会解析到 zh-CN；被删语言的系统上 app.getLocale() / navigator.language 会回落 en-US。
electronLanguages:
  - en
  - en-GB
  - zh-CN

files:
  - dist/**/*
  - assets/**/*
  - package.json
  # 打包后 renderer / ai-chat 从 process.resourcesPath 加载（见 extraResources），
  # dist/ 下由 copy-renderer 生成的副本只供未打包的本地运行使用 —— 不再重复塞进 asar（~224MB）。
  - '!dist/renderer/**'
  - '!dist/ai-chat/**'
  # 预加载只用 esbuild 产物 *.bundle.js
  - '!dist/preload.js'
  - '!dist/ai-chat-preload.js'
  # 运行时从 resources/assets 读（extraResources），asar 内不再带一份背景图
  - '!assets/backgrounds/**'
  - '!**/*.map'
  - '!**/*.{ts,mts,cts,tsx}'
  - '!**/*.d.ts'
  - '!**/node_modules/**/*.{md,markdown}'
  - '!**/node_modules/**/{test,tests,__tests__,__mocks__,docs,example,examples,coverage,.github}/**'
  - '!**/node_modules/**/{tsconfig*.json,.eslintrc*,.prettierrc*,.editorconfig,.npmignore}'
  # onnxruntime-web（~135MB）：唯一使用方是 voice/sileroCore.ts（在 sileroWorker.ts 的 worker 线程里）的 import('onnxruntime-web')，
  # Node 下走 exports.node → dist/ort.node.min.{mjs,js}，它只加载 ort-wasm-simd-threaded.mjs → .wasm。
  # 浏览器 / WebGPU / WebGL / JSEP / JSPI / asyncify 构建全部用不到，只保留这 4 个文件（~14MB）。
  # 升级 onnxruntime-web 后需重新核对 ort.node.min.mjs 引用的文件名。
  - '!**/node_modules/onnxruntime-web/dist/ort.{js,mjs,min.js,min.mjs,bundle.min.mjs}'
  - '!**/node_modules/onnxruntime-web/dist/ort.{all,jspi,wasm,webgl,webgpu}.*'
  - '!**/node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.{asyncify,jsep,jspi}.*'
  # tesseract.js-core（~43MB）：Node 下 tesseract.js 的 worker-script/node/getCore.js 用 wasm-feature-detect
  # 选核心，Electron（Chromium ≥ 114）恒支持 relaxed SIMD，只会走 relaxedsimd 分支；simd / 无 SIMD
  # 回退分支在 Electron 里不可达。tesseract.js 7.0.0 把布尔 lstmOnly 当 OEM 枚举比较，实际总是加载
  # 非 LSTM 的 tesseract-core-relaxedsimd；两种 relaxedsimd 都保留，上游修好后无需改这里。
  # *.wasm.js 是把 wasm 内联成 base64 的单文件变体；Node 用的 .js 直接读同名 .wasm，不需要。
  - '!**/node_modules/tesseract.js-core/*.wasm.js'
  - '!**/node_modules/tesseract.js-core/tesseract-core{,-lstm,-simd,-simd-lstm}.{js,wasm}'

# 默认 normal：maximum 对已压缩的模型纹理收益极小、但显著拖慢打包
compression: normal

asarUnpack:
  # Silero VAD：onnxruntime-web 的 wasm / worker 模块需从磁盘加载
  - '**/node_modules/onnxruntime-web/dist/**'
  # 知识库 OCR：tesseract.js 的 worker_threads 脚本与 tesseract.js-core WASM 需从磁盘加载
  - '**/node_modules/tesseract.js/**'
  - '**/node_modules/tesseract.js-core/**'

extraResources:
  - from: ../renderer/dist
    to: renderer
  - from: ../ai-chat/dist
    to: ai-chat
  - from: assets
    to: assets

directories:
  buildResources: assets
  output: ../../dist

extraMetadata:
  main: dist/main.js

protocols:
  - name: Nomi
    schemes:
      - nomi

# ---------------------------------------------------------------
# macOS · DMG（首次手动安装）+ ZIP（electron-updater / Squirrel.Mac 自动更新必需：
# MacUpdater 只会从 latest-mac.yml 的 files 里挑 zip，没有 zip 会抛 ERR_UPDATER_ZIP_FILE_NOT_FOUND）。
# x64 / arm64 各一份 dmg + zip，latest-mac.yml 同时列出它们。签名：CSC_LINK / CSC_KEY_PASSWORD（Developer ID Application .p12）。
# 公证：electron-builder 检测到 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 即自动
# notarize（notarytool）。CI 由 scripts/release/signing-env.mjs 门控：整组齐全才导出，否则未签名 / 不公证。
# ---------------------------------------------------------------
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: assets/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  extendInfo:
    NSAppleEventsUsageDescription: Nomi 读取并（经你同意后）创建「日历」中的日程，用于提醒与每日简报。
    NSCalendarsUsageDescription: Nomi 读取你的日历日程，用于提醒与每日简报。
    NSCalendarsFullAccessUsageDescription: Nomi 读取你的日历日程，用于提醒与每日简报。
    NSMicrophoneUsageDescription: Nomi 用麦克风进行语音输入与唤醒词识别。

# ---------------------------------------------------------------
# Windows · NSIS；code sign 通过 WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD 启用
# （electron-builder 的 Windows 专用变量，与 mac 证书分开；未注入则跳过 sign）。
# ---------------------------------------------------------------
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico

# 安装 / 卸载程序与安装向导标题图标同样使用 ink（显式声明，避免回落到默认 Electron 图标）
nsis:
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico

# ---------------------------------------------------------------
# Linux · AppImage（P9-9 alpha 首发目标）
# ---------------------------------------------------------------
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
  # 可执行文件名（默认取 package.json name，会得到 '@nomi-aielectron'）
  executableName: nomi
  # electron-builder 26+: derive .desktop / WM_CLASS from package.json desktopName
  syncDesktopName: true
  icon: assets/icons

# ---------------------------------------------------------------
# Publish · GitHub Releases (Cookieboty/nomi-ai)
# electron-updater reads latest*.yml from the Release assets.
# CI sets GH_TOKEN=$GITHUB_TOKEN and runs --publish always on tags.
# ---------------------------------------------------------------
publish:
  provider: github
  owner: Cookieboty
  repo: nomi-ai
  # v* tags upload to a draft Release; CI job publish-release publishes it once all three
  # platforms (and their latest*.yml) are uploaded, so installed apps never see a Release
  # without their platform's update metadata (#146).
  # Do not push a tag until you are ready for users to receive it (see docs/RELEASE.md).
  releaseType: draft
